[package]
name = "sai-plugin-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lua plugin runtime and host contracts for Sai"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
blake2 = "0.10"
blake3 = "1.5"
chrono = "0.4"
crc32fast = "1.4"
hex = "0.4"
html2md = "0.2"
html2text = "0.12"
html2text-document = { package = "html2text", version = "0.13.6" }
jsonschema = { version = "0.49.5", default-features = false }
mlua = { version = "0.12.1", features = ["lua54", "vendored", "async", "send", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits", "serialize"] }
sai-sqlite-buffer = { path = "../sai-sqlite-buffer" }
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
semver = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.15"
