name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unused Chrome package source
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            bubblewrap \
            ripgrep

      - name: Enable sandbox namespaces for regression tests
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Check release versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release/check-versions.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build Linux executable
        run: cargo build --release --locked

      - name: Verify Linux executable
        run: test -x target/release/sai

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run terminal emulator regressions
        shell: bash
        env:
          SAI_TEST_BINARY: ${{ github.workspace }}/target/release/sai
        run: uv run scripts/tui_regression.py 2>&1 | tee terminal-regressions.log

      - name: Run restricted network regressions
        env:
          SAI_TEST_BINARY: ${{ github.workspace }}/target/release/sai
        run: python3 scripts/network-sandbox-regression.py

      - name: Run codemode integration regressions
        shell: bash
        env:
          SAI_TEST_BINARY: ${{ github.workspace }}/target/release/sai
        run: uv run --python 3.12 scripts/test_codemode.py 2>&1 | tee codemode-regressions.log

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-regression-logs
          path: '*-regressions.log'
          if-no-files-found: ignore

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: sai-linux-x86_64
          path: target/release/sai
          if-no-files-found: error
